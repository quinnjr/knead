packages:
  - packages/*
  - examples/*
  - site

# Supply-chain policy, set explicitly rather than relying on pnpm defaults.
# Only install versions published at least one day ago (pnpm 12's default,
# written down so it cannot silently change).
minimumReleaseAge: 1440
# Exact versions exempt from the age gate (first-party Leaven releases);
# remove each once it is older than minimumReleaseAge. Publish times from the
# npm registry; each line says when it may be removed (UTC).
minimumReleaseAgeExclude:
  - '@leaven-graphql/core@0.2.3' # published 2026-10-16T19:41Z, remove after 2026-10-17T19:42Z
  - '@leaven-graphql/ws@0.2.3' # published 2026-10-16T19:39Z, remove after 2026-10-17T19:40Z
# Refuse a version whose publish trust evidence (provenance / trusted
# publisher) is weaker than an earlier version of the same package.
trustPolicy: no-downgrade
# Accepted trust downgrades, by exact version. prisma 7.10.x was published from an npm token
# without provenance (7.9.1 had it); 7.10.1 was accepted deliberately on 2026-10-17 for its
# mysql2 and deepmerge-ts security fixes. Remove when an attested prisma 7 release ships.
trustPolicyExclude:
  - 'prisma@7.10.1'
# Fail the install when a dependency has build scripts nobody has reviewed.
strictDepBuilds: true
# Transitive dependencies may only come from the registry (no git/tarball URLs).
blockExoticSubdeps: true
# Reviewed build scripts. Prisma's postinstall only prefetches engines; the CLI
# fetches the schema engine on first use, so it stays off.
allowBuilds:
  '@prisma/engines': false
  prisma: false
