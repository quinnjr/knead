version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    # Matches minimumReleaseAge in pnpm-workspace.yaml: let new releases age before proposing them.
    cooldown:
      default-days: 1
    commit-message:
      prefix: build(deps)
    ignore:
      # Leaven (@leaven-graphql/*) declares graphql ^16 as a peer; a new graphql major can only
      # land once Leaven supports it. Remove this entry when it does.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    # Give new action releases a few days for problems to surface before pinning them.
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
