version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    # Matches minimumReleaseAge in pnpm-workspace.yaml: let new releases age before proposing them.
    cooldown:
      default-days: 1
    commit-message:
      prefix: build(deps)
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
