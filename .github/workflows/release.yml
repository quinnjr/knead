name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm clean
      - run: pnpm build
      - run: pnpm check:pack
      # npm trusted publishing (OIDC): no NPM_TOKEN. pnpm exchanges this job's
      # GitHub OIDC token (`id-token: write` above) for a short-lived publish
      # token per package, matched against the trusted publisher configured on
      # npmjs.com (repo quinnjr/high-performance-modular-web-server, workflow
      # release.yml). Provenance is attached automatically while the repo is
      # public; npm cannot attest builds from a private repo.
      - run: pnpm release
