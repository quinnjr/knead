name: Docs
on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but a running deploy finishes.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.21.0
  BUN_VERSION: 1.4.3
  # `bun --revision` of the official BUN_VERSION release, checked after setup-bun.
  BUN_REVISION: 1.4.3+c6da4a4d3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check Bun revision
        run: |
          if [ "$(bun --revision)" != "$BUN_REVISION" ]; then
            echo "::error::bun is $(bun --revision), expected $BUN_REVISION"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Snippets are typechecked against the packages; content tests check links, snippet
      # includes and that every package export is documented; the build fails on any broken
      # internal link or #fragment.
      - run: pnpm typecheck
      - run: pnpm --filter @knead-js/docs check
      - run: pnpm --filter @knead-js/docs test
      - run: pnpm --filter @knead-js/docs build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
