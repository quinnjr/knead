name: CI
on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'release/**']

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0
  BUN_VERSION: 1.4.3
  # `bun --revision` of the official BUN_VERSION release, checked after setup-bun.
  BUN_REVISION: 1.4.3+c6da4a4d3

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 # redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the version in package.json `packageManager`. The action ignores the +sha512
      # suffix (corepack verifies it), so check at least that the expected version arrived.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Check pnpm version
        run: |
          want="$(jq -r .packageManager package.json | sed -E 's/^pnpm@([^+]+).*/\1/')"
          if [ "$(pnpm --version)" != "$want" ]; then
            echo "::error::pnpm is $(pnpm --version), expected $want"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # CI caches the pnpm store on purpose (`cache: pnpm`) to keep PR runs fast; release.yml
          # deliberately does not cache. package-manager-cache: false only stops setup-node v5+
          # from adding its automatic cache on top of the explicit one.
          package-manager-cache: false
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Check Node version
        run: |
          if [ "$(node --version)" != "v$NODE_VERSION" ]; then
            echo "::error::node is $(node --version), expected v$NODE_VERSION"; exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check Bun revision
        run: |
          if [ "$(bun --revision)" != "$BUN_REVISION" ]; then
            echo "::error::bun is $(bun --revision), expected $BUN_REVISION"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      # The dev toolchain builds the published artifact, so audit it too. Here a finding only
      # warns, so an advisory in a dev tool does not block unrelated PRs; release.yml fails on it.
      - name: Audit all dependencies (warning only)
        run: |
          if ! pnpm audit --audit-level=high; then
            echo "::warning::pnpm audit found high or critical advisories in dev dependencies; release.yml will refuse to publish until they are fixed"
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:pack
      - run: pnpm test
      - run: pnpm --filter @hpmws/example-graphql-server smoke

